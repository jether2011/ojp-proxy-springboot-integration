services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'DEFAULT_ENCODING=UTF8'
      - 'POSTGRES_DB=ojp_db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=user'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "exit 0"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: